server:
  port: 8080

spring:
  application:
    name: sdncustom

  # H2 嵌入式数据库
  datasource:
    url: jdbc:h2:file:./data/sdncustom;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000

# TDengine 配置
tdengine:
  url: jdbc:TAOS://localhost:6030/sdncustom
  username: root
  password: taosdata

# 自定义配置
sdncustom:
  # 采集引擎配置
  acquisition:
    interval-ms: 200
