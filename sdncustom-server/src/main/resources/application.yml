server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized   # 匿名探活只见 status，鉴权后可见 details
  health:
    redis:
      enabled: false                  # Redis 故障按设计降级，不拖垮健康判定
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: sdncustom

  # H2 嵌入式数据库
  datasource:
    url: jdbc:h2:file:./data/sdncustom;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000

# TDengine 配置（url 可用环境变量覆盖；前缀 TAOS-RS 走 REST 免客户端，TAOS 走原生）
tdengine:
  url: ${TDENGINE_URL:jdbc:TAOS-RS://localhost:6041/sdncustom}
  username: ${TDENGINE_USERNAME:root}
  password: ${TDENGINE_PASSWORD:taosdata}

# 自定义配置
sdncustom:
  # 采集引擎配置
  acquisition:
    interval-ms: 200

  # 落库（Redis 实时缓存 + TDengine 历史）后台队列
  persistence:
    # 待落库批次队列容量，满则丢最旧批次（接受该批次的历史永久缺失）
    queue-capacity: 200

  # 传播（设备写出）后台阶段
  propagation:
    # 队列无界（写命令不丢）；深度超过此值打一次 WARN，让无界增长的 OOM 风险在发生之前可见
    queue-warn-depth: 100
    # 停机排空窗口（秒）；超时则强杀并丢弃剩余批次——这是唯一会丢写命令的路径
    drain-timeout-seconds: ${SDNCUSTOM_PROPAGATION_DRAIN_S:5}

  # 断线自动重连（只管非 MQTT；MQTT 由 Paho 自带重连）
  channel:
    reconnect:
      # 扫一遍"期望连接但当前未连"的通道的间隔
      scan-interval-ms: ${SDNCUSTOM_RECONNECT_SCAN_MS:5000}
      # 退避：initial-delay-ms * multiplier^(连续失败次数-1)，封顶 max-delay-ms
      initial-delay-ms: ${SDNCUSTOM_RECONNECT_INITIAL_MS:2000}
      max-delay-ms: ${SDNCUSTOM_RECONNECT_MAX_MS:60000}
      multiplier: ${SDNCUSTOM_RECONNECT_MULTIPLIER:2.0}

  # WebSocket 推送与背压
  websocket:
    # 待推送批次队列容量，满则丢最旧批次
    push-queue-capacity: 200
    # 单会话待发消息队列容量；消费不过来即断开慢客户端
    session-send-queue-capacity: 512

  # 历史存储配置
  history:
    # TDengine 保留天数（KEEP），超期数据自动清理
    keep-days: ${SDNCUSTOM_HISTORY_KEEP_DAYS:30}

  # 安全配置
  security:
    username: ${SDNCUSTOM_SECURITY_USERNAME:admin}
    password: ${SDNCUSTOM_SECURITY_PASSWORD:changeme}
    jwt:
      # 生产环境必须配置（至少 32 字节）；为空时启动使用随机密钥，重启后已发 token 失效
      secret: ${SDNCUSTOM_JWT_SECRET:}
      expire-hours: ${SDNCUSTOM_JWT_EXPIRE_HOURS:24}
