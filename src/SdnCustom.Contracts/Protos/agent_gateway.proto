syntax = "proto3";

package sdncustom.agent.v1;

option csharp_namespace = "SdnCustom.Contracts.Agent.V1";

service AgentGateway {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

enum DeviceProtocol {
  DEVICE_PROTOCOL_UNSPECIFIED = 0;
  CUSTOM_TCP = 1;
  OPC_UA = 2;
}

enum PointDirection {
  POINT_DIRECTION_UNSPECIFIED = 0;
  INPUT = 1;
  OUTPUT = 2;
}

enum PointDataType {
  POINT_DATA_TYPE_UNSPECIFIED = 0;
  BOOL = 1;
  INT16 = 2;
  INT32 = 3;
  FLOAT32 = 4;
  FLOAT64 = 5;
  STRING = 6;
}

enum PointQuality {
  POINT_QUALITY_UNSPECIFIED = 0;
  GOOD = 1;
  BAD = 2;
  UNCERTAIN = 3;
  COMM_LOST = 4;
}

enum ClientConnectionState {
  CLIENT_CONNECTION_STATE_UNSPECIFIED = 0;
  DISCONNECTED = 1;
  CONNECTING = 2;
  CONNECTED = 3;
  ERROR = 4;
}

message AgentMessage {
  string client_code = 1;
  uint64 sequence = 2;
  int64 sent_unix_ns = 3;
  oneof payload {
    Hello hello = 10;
    ClientStatusChanged status_changed = 11;
    PointBatch value_batch = 12;
    PointSnapshot snapshot = 13;
    WriteResult write_result = 14;
    LogEvent log_event = 15;
    Ping ping = 16;
  }
}

message ServerMessage {
  uint64 sequence = 1;
  int64 sent_unix_ns = 2;
  oneof payload {
    Welcome welcome = 10;
    StartCommunication start_communication = 11;
    StopCommunication stop_communication = 12;
    WritePoint write_point = 13;
    SnapshotRequest request_snapshot = 14;
    Ping ping = 15;
    ConfigurePoints configure_points = 16;
  }
}

message Hello {
  string protocol_version = 1;
  string client_name = 2;
  string app_version = 3;
  string instance_id = 4;
  DeviceProtocol protocol = 5;
  string endpoint_display = 6;
  string catalog_revision = 7;
  repeated PointDefinition points = 8;
}

message PointDefinition {
  string point_id = 1;
  string point_name = 2;
  string address = 3;
  PointDataType data_type = 4;
  string unit = 5;
  PointDirection direction = 6;
  string source_input_point_id = 7;
  double deadband = 8;
  string group = 9;
}

message ClientStatusChanged {
  ClientConnectionState state = 1;
  string message = 2;
}

message TypedValue {
  oneof kind {
    bool bool_value = 1;
    sint64 int_value = 2;
    double double_value = 3;
    string string_value = 4;
  }
}

message PointSample {
  string client_code = 1;
  string point_id = 2;
  TypedValue value = 3;
  PointQuality quality = 4;
  int64 timestamp_unix_ns = 5;
  string source_client_code = 6;
  string source_point_id = 7;
}

message PointBatch {
  repeated PointSample values = 1;
}

message PointSnapshot {
  repeated PointSample values = 1;
}

message Welcome {
  bool accepted = 1;
  string message = 2;
  bool desired_running = 3;
  int64 server_unix_ns = 4;
  uint64 next_sequence = 5;
  repeated PointDefinition configured_points = 6;
  string catalog_revision = 7;
}

message StartCommunication {
  string command_id = 1;
}

message StopCommunication {
  string command_id = 1;
}

message WritePoint {
  string command_id = 1;
  string point_id = 2;
  TypedValue value = 3;
  int64 timestamp_unix_ns = 4;
  string source_client_code = 5;
  string source_point_id = 6;
}

message SnapshotRequest {
  string request_id = 1;
}

message ConfigurePoints {
  string catalog_revision = 1;
  repeated PointDefinition points = 2;
  string message = 3;
}

message WriteResult {
  string command_id = 1;
  bool success = 2;
  string error_message = 3;
  int64 completed_unix_ns = 4;
}

message LogEvent {
  int64 timestamp_unix_ns = 1;
  string level = 2;
  string category = 3;
  string message = 4;
}

message Ping {
  int64 timestamp_unix_ns = 1;
}
